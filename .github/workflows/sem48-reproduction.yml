name: SEM-48 Windows reproduction

on:
  pull_request:
    paths:
      - '.github/workflows/sem48-reproduction.yml'
      - 'slides/inputs/results/**'
      - 'slides/inputs/VINH.md'
      - 'docs/evidence/SEM-48/**'
      - 'experiments/pilots/**'
      - 'experiments/runs/**'
      - 'experiments/SUMMARY.md'
      - 'docs/evidence/SEM-43/**'
      - 'docs/evidence/SEM-41/**'

permissions:
  contents: read

jobs:
  windows-crlf:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Enable CRLF before checkout
        shell: pwsh
        run: git config --global core.autocrlf true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned rendering dependencies
        run: python -m pip install -r slides/inputs/results/requirements.txt
      - name: Test content and line ending guards
        run: python -B -m unittest discover -s slides/inputs/results/tests -v
      - name: Compare all six artifacts with committed SHA-256
        shell: pwsh
        env:
          SEM48_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python -B slides/inputs/results/verify_reproduction.py --require-crlf --output "$env:RUNNER_TEMP/sem48-reproduction"
      - name: Keep reproduction report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sem48-windows-crlf-report
          path: ${{ runner.temp }}/sem48-reproduction/reproduction-report.json
          if-no-files-found: error
